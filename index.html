  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); onMove(e); onClick(e); }, { passive:false });

  document.getElementById("regen").addEventListener("click", () => { if (busy()) return; generate(); placeUnits(); selectUnit(units.find(u => u.team === "player")); renderLog(); });
  document.getElementById("endturn").addEventListener("click", () => { if (!busy()) endPlayerTurn(); });
  document.getElementById("act-shoot").addEventListener("click", () => enterTargeting("ranged"));
  document.getElementById("act-melee").addEventListener("click", () => enterTargeting("melee"));
  document.getElementById("act-ow-shoot").addEventListener("click", () => doOverwatch("ranged"));
  document.getElementById("act-ow-melee").addEventListener("click", () => doOverwatch("melee"));
  document.getElementById("act-reload").addEventListener("click", doReload);
  document.getElementById("act-brace").addEventListener("click", doBrace);
  document.getElementById("act-cracker").addEventListener("click", enterThrow);

  if (typeof window !== "undefined" && window.addEventListener)
    window.addEventListener("keydown", (e) => {
      if (e.key === "Tab"){ e.preventDefault(); if (busy()) return; targeting ? cycleTarget(e.shiftKey ? -1 : 1) : cycleUnit(e.shiftKey ? -1 : 1); }
      else if (e.key === "Enter"){ if (targeting) confirmTarget(); }
      else if (e.key === "Escape"){ cancelTargeting(); cancelThrow(); }
    });

  // ---- Écran d'ouverture --------------------------------------------------
  // Texte d'intro. Remplace librement le bloc ci-dessous par le contenu
  // d'Opening.txt. Une ligne ne contenant que « _ » marque une coupure de
  // page : l'écran s'efface et un bouton « ... » invite à continuer.
  const INTRO_TEXT = `Merry: What are we off to again?
Gizzard: Asking me? … Fuck if I know.
_
Merry: Sarge, What's the plan? Saving a bunch of kids?
Gizzard: or animals, innit?
_

_
Gizzard: Maybe it was about killing some sort of undead?
Merry: Can't kill 'em.

Gizzard: Or bandits?
Merry: I think I recall bandits, yeah. From the brief.
Gizzard: You've had a brief?? Come on…
_
Stiff: You did too, Gizz. I think.
Gizzard: Weren't you the one giving it?
Stiff: I imagine I should've been.
_
Stiff: Anyway, let's get this going. They should be close now.

Merry: So it WAS bandits! I knew it.
Stiff: See, you're not such a no-good.
_

  const introEl = document.getElementById("intro");
  const introTextEl = document.getElementById("introtext");
  const introBtn = document.getElementById("introbtn");
  const sleepI = (ms) => new Promise(r => setTimeout(r, ms));

  function waitBtn(label){
    return new Promise(res => {
      if (!introBtn || !introBtn.addEventListener){ res(); return; }
      introBtn.textContent = label;
      introBtn.style.visibility = "visible";
      const h = () => { introBtn.removeEventListener("click", h); introBtn.style.visibility = "hidden"; res(); };
      introBtn.addEventListener("click", h);
    });
  }

  async function typeLine(line){
    if (!introTextEl) return;
    const base = introTextEl.textContent;
    for (let i = 0; i < line.length; i++){
      introTextEl.textContent = base + line.slice(0, i + 1);
      const ch = line[i];
      let d = 30;
      if (ch === "…") d = 650;            // ellipse : longue suspension
      else if (ch === ".") d = 230;       // les « ... » s'égrènent plus lentement
      else if (",;:!?".includes(ch)) d = 130;
      else if (ch === " ") d = 20;
      await sleepI(d);
    }
  }

  async function runIntro(){
    await waitBtn("new game");           // écran noir : un seul bouton
    const pages = INTRO_TEXT.replace(/\r/g, "").split(/\n[ \t]*_[ \t]*\n/);
    for (let p = 0; p < pages.length; p++){
      if (introTextEl) introTextEl.textContent = "";
      const lines = pages[p].split("\n");
      for (let i = 0; i < lines.length; i++){
        if (i > 0){ if (introTextEl) introTextEl.textContent += "\n"; await sleepI(450); }  // petite pause entre les lignes
        await typeLine(lines[i]);
      }
      await waitBtn(p < pages.length - 1 ? "..." : "...");
    }
    finishIntro();
  }

  function finishIntro(){
    introActive = false;
    if (introEl && introEl.style) introEl.style.display = "none";
    selectUnit(units.find(u => u.team === "player" && u.hp > 0));
    draw();
  }

  // ---- Init ---------------------------------------------------------------
  setupCanvas(); generate(); placeUnits();
  selected = units.find(u => u.team === "player"); reach = selected ? computeReach(selected) : null;
  renderLog(); refreshAll();
  runIntro();
})();
</script>
</body>
