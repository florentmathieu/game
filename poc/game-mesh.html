<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malazan — cœur maillage : éditeur + jeu</title>
<style>
  :root{ --bg:#0e0b07; --pan:#15110c; --acc:#caa24a; --ink:#e8ddc8; }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,Segoe UI,Roboto,sans-serif; display:flex; gap:14px; padding:16px; align-items:flex-start; flex-wrap:wrap }
  #board{ background:#0b0906; border:1px solid #3a2c1c; border-radius:8px; touch-action:none }
  .panel{ width:300px; background:var(--pan); border:1px solid #3a2c1c; border-radius:10px; padding:13px; font-size:.86rem; line-height:1.45 }
  h1{ font-size:1rem; color:var(--acc); margin:0 0 6px } h2{ font-size:.74rem; color:var(--acc); margin:11px 0 3px; text-transform:uppercase; letter-spacing:1px }
  #turn{ font-weight:bold; color:#ffd479 } #msg{ min-height:2.2em; color:#9fd3ec; margin:3px 0 }
  button{ background:#1c150e; color:var(--ink); border:1px solid #5a4530; border-radius:6px; padding:5px 8px; cursor:pointer; font-size:.82rem; margin:1px } button:hover{ background:#241a12 } button.on{ background:#5a4a20; border-color:#caa24a } button:disabled{opacity:.4}
  select{ background:#1c150e;color:var(--ink);border:1px solid #5a4530;border-radius:6px;padding:4px }
  .row{ display:flex; align-items:center; gap:6px; margin:4px 0; flex-wrap:wrap } input[type=range]{ flex:1 }
  .leg{ display:flex; align-items:center; gap:6px; margin:2px 0; font-size:.74rem } .sw{ width:13px;height:13px;border-radius:3px;border:1px solid #00000066 }
  .hint{ color:#9a8a74; font-size:.72rem; margin-top:4px } .editonly{display:block} .playonly{display:block} body.play .editonly{display:none} body:not(.play) .playonly{display:none}
  #export{ width:100%; height:70px; background:#0b0906;color:#9fd3ec;border:1px solid #3a2c1c;border-radius:6px;font-size:.66rem;display:none }
  #log{ max-height:120px; overflow:auto; font-size:.74rem; border-top:1px solid #3a2c1c; margin-top:6px; padding-top:5px } #log div{margin:1px 0} .pl{color:#9fd3ec}.en{color:#e8a39f}
  #over{ position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:9 } #over.show{display:flex} #over h2{font-size:2rem;margin:0}
</style>
</head>
<body>
<canvas id="board" width="720" height="560"></canvas>
<div class="panel">
  <h1>Cœur maillage</h1>
  <div class="row"><button id="mode">▶ Jouer</button></div>

  <div class="editonly">
    <h2>1 · Forme (zones + distorsion)</h2>
    <div class="row" id="zones"></div>
    <div class="row"><label style="flex:1">Distorsion <input id="dist" type="range" min="0" max="100" value="28"></label><span id="distv">28%</span></div>
    <div class="row"><label style="flex:1">Densité <input id="dens" type="range" min="30" max="64" value="44"></label><span id="densv">44</span> <button id="regen">↻</button></div>
    <div class="hint">Peins les zones puis règle la distorsion. ⚠ régénérer la forme remet à zéro terrain & unités.</div>
    <h2>2 · Terrain & relief</h2>
    <div class="row" id="terr"></div>
    <div class="row" id="relief"></div>
    <h2>3 · Unités</h2>
    <div class="row"><select id="uteam"><option value="player">🔵 Allié</option><option value="enemy">🔴 Ennemi</option></select>
      <select id="ucls"></select></div>
    <div class="row"><button id="tplace" data-tool="unit">Poser l'unité</button><button id="terase" data-tool="erase">Gomme</button></div>
    <h2>Mission</h2>
    <div class="row"><button id="doexport">⬇ Exporter (JSON)</button></div>
    <textarea id="export" readonly></textarea>
    <div class="hint" id="counts"></div>
  </div>

  <div class="playonly">
    <h2>Combat</h2>
    <div>Tour : <span id="turn">Joueur</span> · PA : <span id="ap">–</span></div>
    <div id="msg"></div>
    <div id="acts"></div>
    <div class="row"><button id="end">Fin de tour ▶</button></div>
    <div id="log"></div>
  </div>
</div>
<div id="over"><h2 id="overtxt"></h2><button id="overbtn">Rejouer</button></div>
<script>
(function(){
  const cv=document.getElementById("board"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height,TWO=Math.PI*2;
  const FREE_MP=2,AP_MAX=2,MOB=3,HEIGHT_BONUS=6,COVER_PEN=30,PB={1:30,2:15};
  const sword=(a,l,h)=>({type:"melee",aim:a,dmgMin:l,dmgMax:h});
  const bow=(a,l,h,r,c)=>({type:"ranged",aim:a,dmgMin:l,dmgMax:h,range:r,clip:c});
  const dagger=(a,l,h,b,s)=>({type:"melee",aim:a,dmgMin:l,dmgMax:h,flank:{back:b,side:s}});
  const CLASSES={
    sergent:{name:"Sergent",hp:10,mob:8,shieldBlock:30,w:{melee:sword(75,4,6)}},
    sapeur:{name:"Sapeur",hp:7,mob:8,w:{ranged:bow(65,3,4,6,1),melee:sword(70,3,5)}},
    assassin:{name:"Assassin",hp:7,mob:8,parry:35,w:{melee:dagger(80,3,4,5,2)}},
    garde:{name:"Garde",hp:8,mob:6,shieldBlock:20,w:{melee:sword(65,3,4)}},
    archer:{name:"Archer",hp:6,mob:6,w:{ranged:bow(70,2,3,8)}},
    brute:{name:"Brute",hp:13,mob:8,w:{melee:sword(70,5,7)}},
  };
  const mk=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  let RND=mk(7), seed=7, mode="edit", editTool="zone:square";

  const MC=72, COLS=Math.ceil(W/MC), ROWS=Math.ceil(H/MC);
  let infl=Array.from({length:ROWS},()=>Array(COLS).fill("square"));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) infl[r][c]= c<COLS/3?"square": c<2*COLS/3?"mix":"hex";

  // ===== géométrie maillage =====
  let cells=[];
  function genMesh(){
    const g=+dens.value, dist=+distEl.value/100, rnd=mk(seed), h=g*0.866, jit=a=>(rnd()*2-1)*a;
    const typeAt=(x,y)=>infl[Math.min(ROWS-1,Math.floor(y/MC))][Math.min(COLS-1,Math.floor(x/MC))];
    const seeds=[];
    for(let j=-1;j*Math.min(g,h)<H+g;j++)for(let i=-1;i*g<W+g;i++){
      let x=i*g,y=j*g; let t=typeAt(Math.max(0,Math.min(W-1,i*g)),Math.max(0,Math.min(H-1,j*g))),amp=dist*g*0.42;
      if(t==="mix"){const pick=Math.floor(rnd()*3);t=["square","hex","pentagon"][pick];}
      if(t==="hex"){x=i*g+(j&1?g/2:0);y=j*h;}else if(t==="pentagon"){x=i*g+(j&1?g/2:0);amp+=g*0.3;}
      x+=jit(amp);y+=jit(amp); if(x>-g&&x<W+g&&y>-g&&y<H+g)seeds.push([x,y]);
    }
    const box=[[0,0],[W,0],[W,H],[0,H]];
    function clip(poly,p,q){const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,nx=p[0]-q[0],ny=p[1]-q[1],ins=v=>(v[0]-mx)*nx+(v[1]-my)*ny>=0,out=[];
      for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],ia=ins(a),ib=ins(b);if(ia)out.push(a);if(ia!==ib){const den=(b[0]-a[0])*nx+(b[1]-a[1])*ny;if(den!==0){const tt=((mx-a[0])*nx+(my-a[1])*ny)/den;out.push([a[0]+tt*(b[0]-a[0]),a[1]+tt*(b[1]-a[1])]);}}}return out;}
    const R=g*2.8; cells=[];
    for(let i=0;i<seeds.length;i++){const p=seeds[i];let poly=box;for(let k=0;k<seeds.length;k++){if(k===i)continue;const q=seeds[k];if(Math.abs(q[0]-p[0])>R||Math.abs(q[1]-p[1])>R)continue;poly=clip(poly,p,q);if(poly.length<3)break;}
      if(poly.length>=3){const cl=[];for(let v=0;v<poly.length;v++){const a=poly[v],b=cl[cl.length-1];if(!b||Math.hypot(a[0]-b[0],a[1]-b[1])>0.8)cl.push(a);}if(cl.length>=2&&Math.hypot(cl[0][0]-cl[cl.length-1][0],cl[0][1]-cl[cl.length-1][1])<0.8)cl.pop();
        if(cl.length>=3){let sx=0,sy=0;for(const v of cl){sx+=v[0];sy+=v[1];}cells.push({id:cells.length,poly:cl,cx:sx/cl.length,cy:sy/cl.length,nb:[],terr:"plain",elev:0});}}}
    buildAdj();
  }
  function buildAdj(){ const map=new Map(); cells.forEach(c=>c.nb=[]);
    cells.forEach((c,i)=>{const p=c.poly;for(let k=0;k<p.length;k++){const a=p[k],b=p[(k+1)%p.length];const key=Math.round((a[0]+b[0])/5)+","+Math.round((a[1]+b[1])/5);if(!map.has(key))map.set(key,[]);map.get(key).push(i);}});
    for(const arr of map.values())for(let a=0;a<arr.length;a++)for(let b=a+1;b<arr.length;b++){const x=arr[a],y=arr[b];if(x!==y&&!cells[x].nb.includes(y)){cells[x].nb.push(y);cells[y].nb.push(x);}} }

  // ===== géométrie utilitaire =====
  function pointIn(poly,x,y){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
  const cellAtXY=(x,y)=>{for(const c of cells)if(pointIn(c.poly,x,y))return c;return null;};
  const norm=a=>{while(a<=-Math.PI)a+=TWO;while(a>Math.PI)a-=TWO;return a;};
  const ang=(a,b)=>Math.atan2(cells[b].cy-cells[a].cy,cells[b].cx-cells[a].cx);
  const passable=id=>cells[id].terr!=="wall";
  const opaque=id=>cells[id].terr==="wall";
  const enterCost=(from,to)=>{ if(!passable(to))return null; if(cells[to].elev-cells[from].elev>=2)return null; const climb=Math.max(0,cells[to].elev-cells[from].elev); return (cells[to].terr==="rough"?2:1)+climb; };

  // ===== unités =====
  let units=[];
  function U(team,cls,cell,name){const t=CLASSES[cls];const wtype=t.w.ranged?"ranged":"melee";const w=t.w[wtype];
    const u={team,cls,name:name||t.name,cell,hp:t.hp,max:t.hp,ap:AP_MAX,freeAvail:true,mob:t.mob,facing:team==="enemy"?Math.PI:0,wtype,flank:w.flank||null,shieldBlock:t.shieldBlock||0,parry:t.parry||0,w:t.w};
    if(w.clip!==undefined){u.clip=w.clip;u.ammo=w.clip;} return u; }
  const occ=()=>new Set(units.filter(u=>u.hp>0).map(u=>u.cell));
  const uAt=id=>units.find(u=>u.hp>0&&u.cell===id);

  // ===== distance / portée / déplacement =====
  function budget(u){return (u.freeAvail?FREE_MP:0)+u.ap*MOB;}
  function apForMove(u,cost){return Math.max(0,Math.ceil((cost-(u.freeAvail?FREE_MP:0))/MOB));}
  function reach(u){const occu=occ();const dist={};dist[u.cell]=0;const pq=[[0,u.cell]];const B=budget(u);
    while(pq.length){let bi=0;for(let i=1;i<pq.length;i++)if(pq[i][0]<pq[bi][0])bi=i;const[d,id]=pq.splice(bi,1)[0];if(d>dist[id])continue;
      for(const n of cells[id].nb){if(occu.has(n))continue;const c=enterCost(id,n);if(c===null)continue;const nd=d+c;if(nd<=B&&(dist[n]===undefined||nd<dist[n])){dist[n]=nd;pq.push([nd,n]);}}}
    delete dist[u.cell];return dist;}
  function pathTo(u,goal){const occu=occ();occu.delete(u.cell);const dist={},prev={};dist[u.cell]=0;const pq=[[0,u.cell]];
    while(pq.length){let bi=0;for(let i=1;i<pq.length;i++)if(pq[i][0]<pq[bi][0])bi=i;const[d,id]=pq.splice(bi,1)[0];if(d>dist[id])continue;
      for(const n of cells[id].nb){if(occu.has(n)&&n!==goal)continue;const c=enterCost(id,n);if(c===null)continue;const nd=d+c;if(dist[n]===undefined||nd<dist[n]){dist[n]=nd;prev[n]=id;pq.push([nd,n]);}}}
    if(dist[goal]===undefined)return null;const p=[goal];let c=goal;while(prev[c]!==undefined){c=prev[c];p.unshift(c);}return p;}
  function hops(a,b){const s={};s[a]=0;const q=[a];while(q.length){const id=q.shift();if(id===b)return s[id];for(const n of cells[id].nb){if(!passable(n))continue;if(s[n]===undefined){s[n]=s[id]+1;q.push(n);}}}return Infinity;}
  function los(a,b){const A=cells[a],B=cells[b],N=Math.max(2,Math.round(Math.hypot(B.cx-A.cx,B.cy-A.cy)/8));
    for(let k=1;k<N;k++){const t=k/N,x=A.cx+(B.cx-A.cx)*t,y=A.cy+(B.cy-A.cy)*t;const c=cellAtXY(x,y);if(c&&c.id!==a&&c.id!==b&&opaque(c.id))return false;}return true;}
  function inRange(att,tgt,m){const w=att.w[m];if(!w)return false;return w.type==="ranged"?(hops(att.cell,tgt.cell)<=(w.range||1)&&los(att.cell,tgt.cell)):hops(att.cell,tgt.cell)<=1;}

  // ===== combat =====
  function flankOf(att,tgt){const diff=Math.abs(norm(Math.atan2(cells[att.cell].cy-cells[tgt.cell].cy,cells[att.cell].cx-cells[tgt.cell].cx)-tgt.facing));return diff>2.2?"back":diff>1.0?"side":"front";}
  function chance(att,tgt,m){const w=att.w[m];let cover=0;if(w.type==="ranged"&&cells[tgt.cell].terr==="cover")cover=COVER_PEN;const dh=Math.max(-3,Math.min(3,cells[att.cell].elev-cells[tgt.cell].elev))*HEIGHT_BONUS;const pb=w.type==="ranged"?(PB[hops(att.cell,tgt.cell)]||0):0;return Math.max(5,Math.min(95,Math.round(w.aim-cover+dh-pb)));}
  function doAttack(att,tgt,m){const w=att.w[m];att.facing=ang(att.cell,tgt.cell);att.ap=0;att.freeAvail=false;if(w.type==="ranged"&&att.clip!==undefined)att.ammo--;
    const ch=chance(att,tgt,m),hit=RND()*100<ch;let txt;
    if(!hit)txt="raté";else{const back=flankOf(att,tgt)==="back";
      if(!back&&tgt.shieldBlock&&RND()*100<tgt.shieldBlock)txt="bloqué 🛡";
      else if(!back&&w.type==="melee"&&tgt.parry&&RND()*100<tgt.parry)txt="paré 🗡";
      else{let dmg=w.dmgMin+Math.floor(RND()*(w.dmgMax-w.dmgMin+1));if(w.flank&&w.type==="melee"){const f=flankOf(att,tgt);dmg+=f==="back"?w.flank.back:f==="side"?w.flank.side:0;}if(att.team==="enemy")dmg=Math.max(1,dmg-1);tgt.hp-=dmg;txt=`touché ${dmg}`+(tgt.hp<=0?(tgt.team==="player"?" ✚K.O.":" ✝"):"");if(tgt.hp<=0)tgt.hp=0;}}
    log(`${att.team==="player"?"▲":"▼"} ${att.name} ${w.type==="ranged"?"tire sur":"frappe"} ${tgt.name} (${ch}%) : ${txt}`,att.team);checkEnd();refresh();}

  // ===== brouillard / tours =====
  let visible=new Set(), turn="player", sel=null, over=false, amode=null;
  function computeVis(){visible=new Set();for(const u of units)if(u.team==="player"&&u.hp>0)for(const c of cells)if(hops(u.cell,c.id)<=7&&los(u.cell,c.id))visible.add(c.id);}
  const seen=u=>visible.has(u.cell);
  const defaultAttack=u=>(u.w.ranged&&(u.clip===undefined||u.ammo>0))?"ranged":"melee";
  function checkEnd(){if(!units.some(u=>u.team==="enemy"&&u.hp>0))end("Victoire !");else if(!units.some(u=>u.team==="player"&&u.hp>0))end("Défaite…");}
  function end(t){over=true;document.getElementById("overtxt").textContent=t;document.getElementById("over").classList.add("show");draw();}
  function log(m,team){if(mode!=="play")return;const el=document.getElementById("log");const d=document.createElement("div");d.className=team==="player"?"pl":"en";d.textContent=m;el.prepend(d);}
  function setMsg(t){document.getElementById("msg").textContent=t;}
  function refresh(){ if(mode==="play")computeVis(); else visible=new Set(cells.map(c=>c.id)); draw(); if(mode==="play")renderActs(); else renderCounts(); }
  function endTurn(){turn="enemy";sel=null;amode=null;refresh();const foes=units.filter(u=>u.team==="enemy"&&u.hp>0);let i=0;
    (function step(){if(over)return;if(i>=foes.length){for(const u of units){u.ap=AP_MAX;u.freeAvail=true;}turn="player";setMsg("À toi.");refresh();return;}
      const e=foes[i++];if(e.hp<=0){step();return;}
      let tgt=null,best=1e9;for(const p of units)if(p.team==="player"&&p.hp>0){const h=hops(e.cell,p.cell);if(h<best){best=h;tgt=p;}}
      if(!tgt){step();return;}
      if(inRange(e,tgt,e.wtype)){doAttack(e,tgt,e.wtype);setTimeout(step,400);return;}
      const pa=pathTo(e,tgt.cell);if(pa){const dist=reach(e);let dest=e.cell;for(let k=1;k<pa.length;k++){const c=pa[k];if(c===tgt.cell)break;if(dist[c]!==undefined)dest=c;else break;}if(dest!==e.cell){const cost=dist[dest];e.facing=ang(e.cell,dest);e.ap-=apForMove(e,cost);if(e.ap<0)e.ap=0;e.freeAvail=false;e.cell=dest;}}
      refresh();if(inRange(e,tgt,e.wtype))setTimeout(()=>{doAttack(e,tgt,e.wtype);setTimeout(step,400);},280);else setTimeout(step,320);})();}

  // ===== interactions =====
  let painting=false;
  cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();const X=e.clientX-r.left,Y=e.clientY-r.top;
    if(mode==="edit"){painting=true;editAt(X,Y);}else playClick(X,Y);});
  cv.addEventListener("pointermove",e=>{if(mode!=="edit"||!painting)return;const r=cv.getBoundingClientRect();editAt(e.clientX-r.left,e.clientY-r.top);});
  window.addEventListener("pointerup",()=>painting=false);
  function editAt(X,Y){
    if(editTool.startsWith("zone:")){ const c=Math.floor(X/MC),r=Math.floor(Y/MC); if(c<0||c>=COLS||r<0||r>=ROWS)return; const t=editTool.slice(5); if(infl[r][c]!==t){infl[r][c]=t;rebuildShape();} return; }
    const cell=cellAtXY(X,Y); if(!cell)return; const id=cell.id;
    if(editTool.startsWith("terr:")){ cell.terr=editTool.slice(5); }
    else if(editTool==="elev+"){ cell.elev=Math.min(3,cell.elev+1); }
    else if(editTool==="elev-"){ cell.elev=Math.max(0,cell.elev-1); }
    else if(editTool==="unit"){ units=units.filter(u=>u.cell!==id); units.push(U(uteam.value,ucls.value,id)); }
    else if(editTool==="erase"){ units=units.filter(u=>u.cell!==id); }
    refresh();
  }
  function playClick(X,Y){if(over||turn!=="player")return;const cell=cellAtXY(X,Y);if(!cell)return;const id=cell.id;const u=uAt(id);
    if(u&&u.team==="player"){sel=u;amode=null;refresh();return;}if(!sel)return;
    if(u&&u.team==="enemy"&&u.hp>0&&seen(u)){const m=amode||defaultAttack(sel);if(sel.ap>0&&sel.w[m]&&inRange(sel,u,m))doAttack(sel,u,m);else setMsg("Hors de portée / vue.");return;}
    const d=reach(sel);if(d[id]!==undefined){sel.facing=ang(sel.cell,id);const cost=d[id];sel.ap-=apForMove(sel,cost);if(sel.ap<0)sel.ap=0;sel.freeAvail=false;sel.cell=id;refresh();}}

  // ===== rendu =====
  const terrFill={plain:"#3a6e4c",rough:"#7a6326",wall:"#2c3a52",cover:"#46663f"};
  const ZCOL={square:"rgba(255,225,176,.13)",hex:"rgba(207,232,255,.13)",pentagon:"rgba(233,198,238,.13)",mix:"rgba(255,255,255,.07)"};
  function poly(c){ctx.beginPath();c.poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();}
  function draw(){
    ctx.clearRect(0,0,W,H);
    const showZones=mode==="edit"&&editTool.startsWith("zone:");
    if(showZones)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ctx.fillStyle=ZCOL[infl[r][c]];ctx.fillRect(c*MC,r*MC,MC,MC);}
    const d=(mode==="play"&&sel&&turn==="player"&&!over)?reach(sel):null;
    for(const c of cells){poly(c);ctx.fillStyle=terrFill[c.terr];ctx.fill();
      if(c.elev>0){ctx.fillStyle="rgba(255,255,255,"+(0.06*c.elev)+")";ctx.fill();}
      if(d&&d[c.id]!==undefined){ctx.fillStyle="rgba(122,223,122,0.30)";ctx.fill();}
      if(mode==="play"&&!visible.has(c.id)){ctx.fillStyle="rgba(0,0,0,0.55)";ctx.fill();}
      ctx.lineWidth=1;ctx.strokeStyle="#0c0a07";ctx.stroke();}
    if(showZones){ctx.strokeStyle="rgba(202,162,74,.3)";for(let c=1;c<COLS;c++){ctx.beginPath();ctx.moveTo(c*MC,0);ctx.lineTo(c*MC,H);ctx.stroke();}for(let r=1;r<ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*MC);ctx.lineTo(W,r*MC);ctx.stroke();}}
    for(const u of units){const c=cells[u.cell];if(!c)continue;const x=c.cx,y=c.cy;
      if(mode==="play"&&u.team==="enemy"&&u.hp>0&&!seen(u))continue;
      if(u.hp<=0){ctx.globalAlpha=.5;ctx.strokeStyle=u.team==="player"?"#86bce6":"#d88a8a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-6,y-6);ctx.lineTo(x+6,y+6);ctx.moveTo(x+6,y-6);ctx.lineTo(x-6,y+6);ctx.stroke();ctx.globalAlpha=1;continue;}
      ctx.beginPath();ctx.moveTo(x+Math.cos(u.facing)*7,y+Math.sin(u.facing)*7);ctx.lineTo(x+Math.cos(u.facing)*15,y+Math.sin(u.facing)*15);ctx.lineWidth=3;ctx.strokeStyle=u.team==="player"?"#bfe6ff":"#f0b0ac";ctx.stroke();
      if(mode==="play"&&sel&&sel.ap>0&&turn==="player"&&u.team==="enemy"&&seen(u)){const m=amode||defaultAttack(sel);if(sel.w[m]&&inRange(sel,u,m)){ctx.beginPath();ctx.arc(x,y,13,0,TWO);ctx.lineWidth=3;ctx.strokeStyle="#e0635f";ctx.stroke();}}
      ctx.beginPath();ctx.arc(x,y,10,0,TWO);ctx.fillStyle=u.team==="player"?"#5fb0d8":"#d8635f";ctx.globalAlpha=(mode==="play"&&u.team==="player"&&u.ap<=0&&turn==="player")?.5:1;ctx.fill();ctx.globalAlpha=1;
      ctx.lineWidth=(u===sel)?3:1.5;ctx.strokeStyle=(u===sel)?"#fff":"rgba(0,0,0,.5)";ctx.stroke();
      ctx.fillStyle="#0b1117";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(u.name[0],x,y);
      const bw=20,bx=x-bw/2,by=y-17;ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(bx-1,by-1,bw+2,5);ctx.fillStyle="#3a3128";ctx.fillRect(bx,by,bw,3);ctx.fillStyle=u.team==="player"?"#6fd06f":"#e06f6f";ctx.fillRect(bx,by,bw*Math.max(0,u.hp)/u.max,3);}
  }

  // ===== UI éditeur =====
  const distEl=document.getElementById("dist"),dens=document.getElementById("dens"),uteam=document.getElementById("uteam"),ucls=document.getElementById("ucls");
  Object.keys(CLASSES).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=CLASSES[k].name;ucls.appendChild(o);});
  function btnRow(host,items){ host.innerHTML=""; items.forEach(([label,tool])=>{const b=document.createElement("button");b.textContent=label;b.dataset.tool=tool;b.className=editTool===tool?"on":"";b.onclick=()=>{editTool=tool;syncTools();refresh();};host.appendChild(b);}); }
  function syncTools(){ document.querySelectorAll("#zones button,#terr button,#relief button,#tplace,#terase").forEach(b=>b.classList.toggle("on",b.dataset.tool===editTool)); }
  btnRow(document.getElementById("zones"),[["⬛","zone:square"],["⬡","zone:hex"],["⬠","zone:pentagon"],["🔀","zone:mix"]]);
  btnRow(document.getElementById("terr"),[["sol","terr:plain"],["accidenté","terr:rough"],["couvert","terr:cover"],["mur","terr:wall"]]);
  btnRow(document.getElementById("relief"),[["⬆ élever","elev+"],["⬇ abaisser","elev-"]]);
  document.getElementById("tplace").onclick=()=>{editTool="unit";syncTools();};
  document.getElementById("terase").onclick=()=>{editTool="erase";syncTools();};

  function rebuildShape(){ genMesh(); units=[]; refresh(); }   // changer la forme remet à zéro
  distEl.oninput=()=>{document.getElementById("distv").textContent=distEl.value+"%";rebuildShape();};
  dens.oninput=()=>{document.getElementById("densv").textContent=dens.value;rebuildShape();};
  document.getElementById("regen").onclick=()=>{seed=(seed*1103515245+12345)&0x7fffffff;rebuildShape();};

  function renderCounts(){ const np=units.filter(u=>u.team==="player").length,ne=units.filter(u=>u.team==="enemy").length;
    document.getElementById("counts").textContent=`${cells.length} cellules · ${np} alliés · ${ne} ennemis`; }
  function exportMission(){ const m={name:"mission-maillage",cells:cells.map(c=>({poly:c.poly.map(p=>[Math.round(p[0]),Math.round(p[1])]),terr:c.terr,elev:c.elev})),
      units:units.map(u=>({team:u.team,cls:u.cls,cell:u.cell}))};
    const ta=document.getElementById("export");ta.style.display="block";ta.value=JSON.stringify(m); ta.select(); }
  document.getElementById("doexport").onclick=exportMission;

  // ===== jeu =====
  function renderActs(){const el=document.getElementById("acts");el.innerHTML="";document.getElementById("ap").textContent=sel?`${sel.ap}/${AP_MAX}`:"–";if(!sel||turn!=="player")return;
    const add=(label,m)=>{const b=document.createElement("button");b.textContent=label;b.className=amode===m?"on":"";b.onclick=()=>{amode=m;renderActs();setMsg("Clique un ennemi.");};el.appendChild(b);};
    if(sel.w.ranged&&(sel.clip===undefined||sel.ammo>0))add("🏹 Tir","ranged");
    if(sel.w.melee)add(sel.flank?"🗡 Dagues":"⚔️ Mêlée","melee");
    if(sel.clip!==undefined&&sel.ammo<sel.clip){const b=document.createElement("button");b.textContent="🔄";b.onclick=()=>{if(sel.ap>0){sel.ap--;sel.ammo=sel.clip;refresh();}};el.appendChild(b);}}
  function startGame(){ if(!units.some(u=>u.team==="player")||!units.some(u=>u.team==="enemy")){ setMsg("Place au moins 1 allié et 1 ennemi (mode Éditer)."); }
    for(const u of units){u.hp=u.max;u.ap=AP_MAX;u.freeAvail=true;} turn="player";over=false;sel=null;amode=null;
    document.getElementById("over").classList.remove("show");document.getElementById("log").innerHTML="";setMsg("À toi — sélectionne une unité.");refresh(); }
  document.getElementById("end").onclick=()=>{if(!over&&turn==="player"&&mode==="play")endTurn();};
  document.getElementById("overbtn").onclick=()=>{ if(mode==="play")startGame(); };
  document.getElementById("mode").onclick=()=>{ mode=mode==="edit"?"play":"edit"; document.body.classList.toggle("play",mode==="play");
    document.getElementById("mode").textContent=mode==="edit"?"▶ Jouer":"✎ Éditer"; if(mode==="play")startGame(); else{sel=null;refresh();} };

  // ===== démarrage : une forme + un roster par défaut =====
  function init(){ genMesh();
    const byX=cells.map((c,i)=>({i,cx:c.cx,cy:c.cy})).filter(o=>passable(o.i));
    const L=byX.slice().sort((a,b)=>a.cx-b.cx).slice(0,16).sort((a,b)=>a.cy-b.cy);
    const Rr=byX.slice().sort((a,b)=>b.cx-a.cx).slice(0,16).sort((a,b)=>a.cy-b.cy);
    units=[U("player","sergent",L[2].i,"Stiff"),U("player","sapeur",L[6].i,"Merry"),U("player","assassin",L[10].i,"Gizzard"),
           U("enemy","garde",Rr[2].i),U("enemy","archer",Rr[6].i),U("enemy","brute",Rr[10].i)];
    refresh();
  }
  init();
})();
</script>
</body>
